[project]
name = "ball-knowledge"
version = "0.1.0"
description = "Rubric-driven deep search over MIT research, powered by OpenAlex"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "openai>=1.50",
    "typesafe-sdk>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "tiktoken>=0.14.0",
    "modal>=1.5.5",
    "fastembed>=0.8.0",
    "markdown-it-py>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ballknowledge"]
